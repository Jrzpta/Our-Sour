spring.application.name=ourSour

server.port=8080
 
# --- MySQL (MySQL Workbench / servidor local) ---
spring.datasource.url=jdbc:mysql://localhost:3306/oursour_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=admin123
 
# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
 
# --- JWT (el secreto debe tener al menos 32 caracteres) ---
jwt.secret=cambia-este-secreto-por-uno-largo-de-al-menos-32-caracteres
jwt.expiration-ms=86400000
 
# --- Reglas de negocio de despacho (estrategia propia del equipo) ---
oursour.shipping.free-threshold=50000
oursour.shipping.flat-cost=4990
